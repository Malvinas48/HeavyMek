    rangeBands: [0, 0, 0, 0]
    rateOfFire: 0
    ammo: null                       # melee, no ammunition
    special: [MELEE, PHYSICAL_ONLY]  # B p.197: Physical Attack Only. DIFF: A p.29 gives Armor Piercing, lost when thrown (thrown 1 hex)
