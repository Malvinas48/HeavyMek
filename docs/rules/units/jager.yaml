    model: PR-25 Autocannon          # B p.221
    code: LAC
    arc: F
    quantity: 1
    accuracy: 0
    damage: 8
    baseRange: 2
    rangeBands: [2, 4, 8, 16]
    rateOfFire: 2
    ammo: 60
    special: []
  - name: Light Rocket Pack/24
    model: Vogel-6 Rocket Pod
    code: LRP/24
    arc: F
    quantity: 1
    accuracy: -1
    damage: 12
    baseRange: 1
    rangeBands: [1, 2, 4, 8]
    rateOfFire: 3
    ammo: 24
    special: [IF]
  - name: Anti-Personnel Grenade Launcher
    model: HLB-16 AP Grenade Launcher
    code: APGL
    arc: FF                          # B p.221 prints "Fixed F.", as on the Hunter. DIFF: A p.43 prints F
    quantity: 1
    accuracy: -1
    damage: 3
    baseRange: 1
    rangeBands: [1, 2, 4, 8]
    rateOfFire: 0
    ammo: 6
    special: [AI, IF, AE0]
  - name: Hand Grenade
    model: HG-2 Hand Grenade
    code: HG
